name: Update Calendar Cache
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Forex Factory calendars
        run: |
          mkdir -p cache
          curl -sf -H "User-Agent: Mozilla/5.0 Chrome/124" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o cache/thisweek.json || echo "[]" > cache/thisweek.json
          curl -sf -H "User-Agent: Mozilla/5.0 Chrome/124" \
            "https://nfs.faireconomy.media/ff_calendar_nextweek.json" \
            -o cache/nextweek.json || echo "[]" > cache/nextweek.json
          python3 -c "
import json
result = []
for f in ['cache/thisweek.json', 'cache/nextweek.json']:
    try:
        data = json.load(open(f))
        if isinstance(data, list): result.extend(data)
    except: pass
json.dump(result, open('cache/calendar.json', 'w'))
print(f'Total: {len(result)} eventos')
"

      - name: Commit cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --staged --quiet || (git commit -m "cache: calendar update" && git push)
