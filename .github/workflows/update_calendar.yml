name: Update Calendar Cache
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: '20'
      - name: Fetch calendar
        run: |
          mkdir -p cache
          curl -sf -H "User-Agent: Mozilla/5.0 Chrome/124" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o cache/thisweek.json || echo "[]" > cache/thisweek.json
          curl -sf -H "User-Agent: Mozilla/5.0 Chrome/124" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o cache/nextweek.json || echo "[]" > cache/nextweek.json
          python3 -c "import json; r=[]; [r.extend(json.load(open(f))) for f in ['cache/thisweek.json','cache/nextweek.json'] if __import__('os').path.exists(f)]; json.dump(r,open('cache/calendar.json','w')); print(len(r))"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --staged --quiet || (git commit -m "cache: $(date -u +%FT%TZ)" && git push)
