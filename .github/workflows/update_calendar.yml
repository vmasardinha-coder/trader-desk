name: Update Calendar Cache
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch calendar
        run: |
          mkdir -p cache
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o cache/thisweek.json || echo "[]" > cache/thisweek.json
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124" \
            "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o cache/nextweek.json || echo "[]" > cache/nextweek.json
          python3 << 'EOF'
import json, os
events = []
for f in ['cache/thisweek.json','cache/nextweek.json']:
    if os.path.exists(f):
        try:
            data = json.load(open(f))
            events.extend(data)
        except: pass
# Filtra apenas moedas relevantes e impact Medium+High
keep = {'USD','EUR','GBP','JPY','AUD','CHF','NZD','CAD'}
filtered = [e for e in events if e.get('country') in keep and e.get('impact') in ['Medium','High']]
json.dump(filtered, open('cache/calendar.json','w'))
print(f'Total: {len(events)} → filtrado: {len(filtered)}')
EOF
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --staged --quiet || (git commit -m "cache: $(date -u +%FT%TZ)" && git push)
